name: Build Reelio APK

# Runs every time changes are uploaded, and can also be started by hand
# from the "Actions" tab with the "Run workflow" button.
# Each successful build is published as a Release with the APKs attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reelio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore the signing key
        run: base64 -d keystore/reelio.jks.b64 > keystore/reelio.jks

      - name: Build the app
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Name the APKs
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "out/Reelio-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/Reelio-v$VERSION-older-32bit-phones.apk"
          ls -la out

      - name: Keep the test APK for the emulator job
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: app/build/outputs/apk/release/app-x86_64-release.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" out/*.apk \
            --title "Reelio ${VERSION}" \
            --notes "Install: open this page on your phone and tap Reelio-v${VERSION}.apk (the 32-bit file is only for older phones). Updates install over the previous version." \
            --latest

      - name: Report build status
        if: always()
        run: |
          mkdir -p /tmp/report
          {
            echo "status: ${{ job.status }}"
            echo "sha: ${{ github.sha }}"
            echo "run: ${{ github.run_number }}"
            echo "==== errors ===="
            grep -E "^e: |error:|What went wrong|FAILED|Missing class|R8" -A6 build.log | head -500 || true
            echo "==== warnings (w:) ===="
            grep -E "^w: " build.log | head -60 || true
            echo "==== tail ===="
            tail -80 build.log || true
          } > /tmp/report/status.txt
          cp out/*.apk /tmp/report/ 2>/dev/null || true
          cd /tmp/report
          git init -q
          git checkout -q -b ci-status
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI run ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status

  qa:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: app/build/outputs/apk/release

      - name: Enable KVM for the test phone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make test songs and videos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          bash tools/make-media.sh /tmp/media

      - name: Test on an Android 14 emulator
        continue-on-error: true
        timeout-minutes: 22
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: timeout 780 bash tools/emulator-test.sh

      - name: Report test results
        if: always()
        run: |
          mkdir -p /tmp/report/qa
          echo "qa job: ${{ job.status }} sha ${{ github.sha }} run ${{ github.run_number }}" > /tmp/report/qa/status.txt
          cd /tmp/report/qa
          git init -q
          git checkout -q -b ci-qa
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "QA run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-qa
